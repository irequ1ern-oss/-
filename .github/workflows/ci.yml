# Проверка каждого pull request: типы, тесты, сборка.
name: Проверка

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s server -t .
      - run: npm run build:account
      - name: Кабинет в Chrome и холодный старт без сети
        run: |
          python -m pip install playwright==1.62.0
          python scripts/acceptance.py
